<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Perfil - EventZone</title>
<link rel="stylesheet" th:href="@{/css/profile.css}" />
</head>
<body>
	<header class="header">
		<div class="container">
			<div class="header-content">
				<div class="logo">
					<div class="logo-icon">📅</div>
					<h1>EventZone</h1>
				</div>

				<button class="logout-btn">
					<span class="logout-icon">🚪</span> 
					<span class="logout-text">Cerrar sesión</span>
				</button>
			</div>
		</div>
	</header>

	<div class="container main-container">
		<div class="profile-layout">
			<aside class="sidebar">
				<div class="sidebar-card">
					<div class="user-avatar-section">
						<div class="user-avatar" id="userAvatar">MG</div>
						<h2 class="user-name" id="userName">María García</h2>
						<p class="user-email" id="userEmail">maria.garcia@email.com</p>
					</div>

					<nav class="sidebar-menu">
						<button class="menu-item active" data-tab="profile">
							<span class="menu-icon">👤</span> <span>Mi Perfil</span>
						</button>

						<button class="menu-item" data-tab="availableEvents">
							<span class="menu-icon">📢</span> 
							<span>Eventos Disponibles</span>
						</button>

						<button class="menu-item" data-tab="tickets">
							<span class="menu-icon">🎫</span> 
							<span>Mis Entradas</span>
						</button>
					</nav>

					<div class="user-stats">
						<div class="stat-item">
							<div class="stat-number" id="ticketsCount">3</div>
							<div class="stat-label">Entradas</div>
						</div>
					</div>
				</div>
			</aside>

			<main class="main-content">

				<!-- TAB PERFIL -->
				<div class="tab-content active" id="profileTab">
					<div class="content-card">
						<div class="card-header">
							<h2>Información Personal</h2>
							<button class="edit-btn" id="editBtn">
								<span>✏️</span> Editar
							</button>
							<div class="edit-actions" id="editActions" style="display: none;">
								<button class="save-btn" id="saveBtn"><span>💾</span> Guardar</button>
								<button class="cancel-btn" id="cancelBtn"><span>❌</span> Cancelar</button>
							</div>
						</div>

						<div class="form-grid">
							<div class="form-field">
								<label class="field-label"><span class="label-icon">👤</span>Nombre completo</label>
								<input type="text" id="nombre" class="field-input" value="María García" readonly>
							</div>

							<div class="form-field">
								<label class="field-label"><span class="label-icon">📧</span>Email</label>
								<input type="email" id="email" class="field-input" value="maria.garcia@email.com" readonly>
							</div>

							<div class="form-field">
								<label class="field-label"><span class="label-icon">📱</span>Teléfono</label>
								<input type="tel" id="telefono" class="field-input" value="+34 612 345 678" readonly>
							</div>

							<div class="form-field">
								<label class="field-label"><span class="label-icon">📍</span>Ciudad</label>
								<input type="text" id="ciudad" class="field-input" value="Madrid, España" readonly>
							</div>

							<div class="form-field">
								<label class="field-label"><span class="label-icon">📅</span>Fecha de nacimiento</label>
								<input type="date" id="fechaNacimiento" class="field-input" value="1995-03-15" readonly>
							</div>

							<div class="form-field full-width">
								<label class="field-label"><span class="label-icon">📝</span>Biografía</label>
								<textarea id="bio" class="field-textarea" readonly>Amante de la música y los festivales. Siempre buscando nuevos eventos para disfrutar.</textarea>
							</div>
						</div>
					</div>
				</div>

				<!-- TAB EVENTOS DISPONIBLES -->
				<div class="tab-content" id="availableEventsTab">
					<h2 class="section-title">Eventos Disponibles</h2>
					<div class="tickets-list" id="availableEventsList"></div>
					<p class="no-events" id="noAvailableEvents" style="display: none;">No hay eventos disponibles actualmente.</p>
				</div>

				<!-- TAB MIS ENTRADAS -->
				<div class="tab-content" id="ticketsTab">
					<h2 class="section-title">Mis Entradas</h2>

					<div class="tickets-list">
						<!-- Entradas de ejemplo… -->
					</div>
				</div>

			</main>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
	<script src="/js/profile.js" th:src="@{/js/profile.js}"></script>
</body>
</html>
