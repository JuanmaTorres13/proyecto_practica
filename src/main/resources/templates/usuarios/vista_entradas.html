<!DOCTYPE html>
<html xmlns:th = "http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Entradas - Eventos</title>
    <link rel="stylesheet" th:href="@{/css/vista_entradas.css}"/>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎫 Mis Entradas</h1>
            <p>Gestiona y visualiza todas tus entradas de eventos</p>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Filtrar por:</label>
                <select id="filterType">
                    <option value="all">Todos los eventos</option>
                    <option value="cine">🎬 Cine</option>
                    <option value="concierto">🎵 Concierto</option>
                    <option value="festival">🎪 Festival</option>
                </select>
                <select id="filterDate">
                    <option value="all">Todas las fechas</option>
                    <option value="upcoming">Próximos eventos</option>
                    <option value="past">Eventos pasados</option>
                </select>
                <input type="text" id="searchInput" placeholder="🔍 Buscar evento...">
            </div>
        </div>

        <div class="tickets-grid" id="ticketsContainer">
            <!-- Las entradas se generarán dinámicamente -->
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">🎭</div>
            <h2>No tienes entradas aún</h2>
            <p>Explora eventos y compra tus entradas favoritas</p>
        </div>
    </div>

    <script th:src="@{/js/vista_entradas.js}"></script>
</body>
</html>
